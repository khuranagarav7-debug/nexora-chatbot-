<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nex-Gen Food Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            line-height: 1.4;
        }

        /* Navigation */
        header {
            padding: 2rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .logo span {
            color: #ff6b6b;
        }

        /* Main Hero Section */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2rem 8% 6rem 8%;
            gap: 5%;
        }

        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            font-size: 4.5rem;
            font-weight: 700;
            color: #222;
            margin-bottom: 2rem;
            line-height: 1;
        }

        .hero-text h1 .highlight {
            color: #2d5a27;
            display: block;
        }

        .btn-cta {
            display: inline-block;
            padding: 1.2rem 2.8rem;
            background-color: #ff6b6b;
            color: white;
            text-decoration: none;
            border-radius: 100px;
            font-weight: 500;
            font-size: 1.1rem;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.25);
            transition: all 0.3s ease;
        }

        .btn-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(255, 107, 107, 0.35);
        }

        /* Imagery */
        .hero-visual {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .hero-visual img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 20px;
        }

        .img-large {
            grid-row: span 2;
            height: 615px !important;
        }

        /* Mobile Adjustments */
        @media (max-width: 968px) {
            .hero {
                flex-direction: column;
                text-align: center;
            }
            .hero-text h1 {
                font-size: 3rem;
            }
            .hero-visual {
                margin-top: 3rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Nex-Gen <span>Food</span></div>
    </header>

    <main class="hero">
        <div class="hero-text">
            <h1>Your Personal <span class="highlight">AI Sous Chef</span></h1>
            <a href="#" class="btn-cta">Start Cooking</a>
        </div>

        <div class="hero-visual">
            <!-- Free images from Unsplash -->
            <img class="img-large" src="https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=600&q=80" alt="Cooking process">
            <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=500&q=80" alt="Plated dish">
            <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=500&q=80" alt="Salad">
        </div>
    </main>

    <!-- Watson Assistant Chat Integration -->
    <script>
      window.watsonAssistantChatOptions = {
        integrationID: "b90c55e8-ea3b-4088-88a2-b83b5ee07701", 
        region: "https://integrations.eu-de.assistant.watson.appdomain.cloud", 
        serviceInstanceID: "b877c3c1-2c26-4ff9-8fbc-17daf4b8d221", 
        onLoad: async (instance) => { await instance.render(); }
      };
      setTimeout(function(){
        const t=document.createElement('script');
        t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" + (window.watsonAssistantChatOptions.clientVersion || 'latest') + "/WatsonAssistantChatEntry.js";
        document.head.appendChild(t);
      });
    </script>

</body>
</html>
